<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML Quiz</h1>
        <form>
            <label for="q1">1. CSS rules are made up of a selector and a ___________ ____.</label>
            <input type="text" id="q1" name="q1">

            <label for="q2">2. What VS Code abbreviation will help you start with a valid HTML
                structure?</label>
            <textarea id="q2" name="q2"></textarea>

            <label for="q3">3. Choose the form element you would use for a yes/no or multiple choice
                question.</label>
            <select id="q3" name="q3">
                <option value="" slected disabled>Choose One</option>
                <option value="text">Text</option>
                <option value="select">Select</option>
                <option value="checkbox">Checkbox</option>
            </select>

            <label for="q4">4. How many heading tags are available in HTML? </label>
            <input type="number" name="q4" id="q4">

            <button type="submit">Submit Quiz</button>
        </form>
    </header>
</body>

</html>
